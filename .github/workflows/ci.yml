name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  fixtures:
    # The Rust signing payload is pinned against the JS SDK. If the SDK changes
    # the encoding, this job fails before the Rust tests start lying.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @stellar/stellar-sdk
      - run: node scripts/gen-fixtures.js > /tmp/regenerated.json
      - name: fixture is reproducible
        run: |
          diff <(jq -S 'del(.sdkVersion)' fixtures/auth_preimage_v1.json) \
               <(jq -S 'del(.sdkVersion)' /tmp/regenerated.json)
