[workspace]
members = ["crates/sigil-auth"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Rufai-Ahmed/sigil"
rust-version = "1.85"

[workspace.dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
