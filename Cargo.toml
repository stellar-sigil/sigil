[workspace]
members = ["crates/sigil-auth", "crates/sigil-spec", "crates/sigil-test", "corpus/no_require_auth", "corpus/caller_not_owner", "probes/auth_target"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/stellar-sigil/sigil"
rust-version = "1.85"

[workspace.dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true
